<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0E0E0E">
<link rel="icon" href="https://academiadepolicia.com.br/wp-content/uploads/2026/04/brasao-academia-de-policia-em-fundo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block" rel="stylesheet">
<script src="/tema.js"></script>
<link rel="stylesheet" href="/vendor/katex/katex.min.css">
<script defer src="/vendor/katex/katex.min.js"></script>
<script defer src="/vendor/katex/contrib/auto-render.min.js"></script>
<link rel="stylesheet" href="/app.css">
<title>Resultado · Simulados Academia de Polícia</title>
</head>
<body>
<div class="fundo" aria-hidden="true"></div>
<header class="topo">
  <div class="in">
    <a class="marca-ap" href="/painel"><img src="https://academiadepolicia.com.br/wp-content/uploads/2026/04/brasao-academia-de-policia-em-fundo.png" alt=""><b>Academia de Polícia<small>Simulados GCM</small></b></a>
    <span class="sp"></span>
    <a class="btn btn-linha btn-sm" href="/painel"><span class="ms">arrow_back</span>Painel</a>
  </div>
</header>

<main class="pagina">
  <section class="card rv">
    <div class="res-top">
      <div class="anel" id="ring"></div>
      <div>
        <span class="kicker"><span class="ms">assignment_turned_in</span><span id="r-sim">Resultado</span></span>
        <h1 id="r-tit" style="font-size:clamp(26px,3.6vw,38px);margin:10px 0">Resultado</h1>
        <p id="r-sub" style="color:var(--txt2);margin:0"></p>
        <p id="r-data" style="color:var(--txt3);font-size:13px;margin:6px 0 0"></p>
        <div class="stats" id="r-stats"></div>
        <div class="aviso-r oculto" id="r-aviso"></div>
      </div>
    </div>
  </section>

  <section class="grid2">
    <div class="card rv">
      <h3><span class="ms">monitoring</span>Desempenho por matéria</h3>
      <div class="temas" id="materias"></div>
    </div>
    <div class="card rv">
      <h3><span class="ms">route</span>Plano de estudo</h3>
      <h4 class="kicker" style="margin:4px 0 8px">Pontos fortes</h4>
      <ul class="foco" id="bem"></ul>
      <h4 class="kicker" style="margin:16px 0 8px">Prioridades</h4>
      <ul class="foco" id="mal"></ul>
    </div>
  </section>

  <section class="card rv" style="margin-top:18px">
    <h3><span class="ms">fact_check</span>Gabarito comentado</h3>
    <div class="filtros">
      <div class="seg" id="filtros">
        <button data-f="todos" class="on">Todas</button>
        <button data-f="erro">Erradas</button>
        <button data-f="branco">Em branco</button>
        <button data-f="acerto">Certas</button>
      </div>
    </div>
    <div id="revisao"></div>
  </section>
</main>

<script src="/ui.js"></script>
<script src="/resultado.js"></script>
</body>
</html>
